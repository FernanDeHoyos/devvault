import com.github.jk1.license.render.CsvReportRenderer
import com.github.jk1.license.render.SimpleHtmlReportRenderer
import com.github.jk1.license.render.XmlReportRenderer

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.github.jk1.dependency-license-report' version '3.1.5'
}

group = 'com.devvault'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

licenseReport {
	configurations = ['runtimeClasspath']
	unionParentPomLicenses = true
	excludeBoms = true
	renderers = [
		new SimpleHtmlReportRenderer('java-dependencies.html'),
		new CsvReportRenderer('java-dependencies.csv'),
		new XmlReportRenderer('java-dependencies.xml', 'DevVault Java Runtime Dependencies')
	]
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	// Nota: spring-boot-starter-security y oauth2-resource-server se retiraron
	// junto con el modulo de autenticacion. El acceso queda protegido por el
	// bind a 127.0.0.1 y por SameOriginFilter.
	// Métricas de procesos locales en Windows/macOS/Linux (JNA).
	implementation 'com.github.oshi:oshi-core:7.6.1'
	implementation 'org.flywaydb:flyway-database-postgresql'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'


 	// Cliente del Docker Engine API (módulo runtime, v0.2)
 	implementation 'com.github.docker-java:docker-java-core:3.4.2'
    implementation 'com.github.docker-java:docker-java-transport-zerodep:3.4.2'

	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	// Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// The Windows preview can embed the separately built React UI in the Boot JAR.
// Ordinary backend builds remain independent from the UI repository.
def previewUiDir = providers.gradleProperty('previewUiDir')
tasks.named('processResources') {
	if (previewUiDir.isPresent()) {
		from(file(previewUiDir.get())) {
			into 'static'
		}
	}
}

tasks.register('extractRuntimeDependencyLicenses') {
	dependsOn tasks.named('generateLicenseReport')
	dependsOn tasks.named('bootJar')

	def extractedLicenses = layout.buildDirectory.dir('reports/dependency-license/java')
	def statusFile = layout.buildDirectory.file('reports/dependency-license/java-license-file-status.txt')
	def packagedJarList = layout.buildDirectory.file('reports/dependency-license/java-packaged-jars.txt')
	outputs.dir(extractedLicenses)
	outputs.file(statusFile)
	outputs.file(packagedJarList)

	doLast {
		def bootJarFile = tasks.named('bootJar').get().archiveFile.get().asFile
		def outputRoot = extractedLicenses.get().asFile
		if (outputRoot.exists()) {
			outputRoot.deleteDir()
		}
		outputRoot.mkdirs()

		def status = []
		def packagedJars = []
		def licensePathPattern = ~/(?i)(?:.*\/)?(license|notice|copying)(\.(txt|md|html|rtf))?$/
		new java.util.zip.ZipFile(bootJarFile).withCloseable { applicationJar ->
			applicationJar.entries().each { applicationEntry ->
				if (!applicationEntry.directory &&
					applicationEntry.name.startsWith('BOOT-INF/lib/') &&
					applicationEntry.name.endsWith('.jar')) {
					packagedJars << new File(applicationEntry.name).name
					def nestedBytes = new java.io.ByteArrayOutputStream()
					applicationJar.getInputStream(applicationEntry).withCloseable { input ->
						nestedBytes << input
					}

					def copied = []
					new java.util.zip.ZipInputStream(
						new java.io.ByteArrayInputStream(nestedBytes.toByteArray())
					).withCloseable { nestedJar ->
						java.util.zip.ZipEntry nestedEntry
						while ((nestedEntry = nestedJar.nextEntry) != null) {
							if (!nestedEntry.directory && nestedEntry.name ==~ licensePathPattern) {
								def destination = new File(
									outputRoot,
									"${new File(applicationEntry.name).name}/${nestedEntry.name}"
								)
								destination.parentFile.mkdirs()
								destination.withOutputStream { output -> output << nestedJar }
								copied << nestedEntry.name
							}
						}
					}
					status << "${new File(applicationEntry.name).name}: " +
						(copied ? "copied ${copied.join(', ')}" :
							'no embedded license/notice text; see java-dependencies.csv')
				}
			}
		}

		statusFile.get().asFile.withWriter('UTF-8') { writer ->
			status.each { writer.writeLine(it) }
		}
		packagedJarList.get().asFile.withWriter('UTF-8') { writer ->
			packagedJars.sort().each { writer.writeLine(it) }
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	// Redundante en Gradle: el plugin de Spring Boot ya añade -parameters.
	// Se mantiene explícito porque el proyecto también se compila desde IDEs
	// (Eclipse/STS), donde el flag solo existe si se configura en .settings.
	options.compilerArgs << '-parameters'
}
