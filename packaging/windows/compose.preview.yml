services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: devvault
      POSTGRES_USER: devvault
      POSTGRES_PASSWORD: devvault_dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devvault -d devvault"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
