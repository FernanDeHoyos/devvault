name: Cross-platform checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout including UI submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Test backend (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew test --no-daemon

      - name: Test backend (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat test --no-daemon

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Lint and build UI
        working-directory: ui
        run: |
          npm run lint
          npm run build

      - name: Build backend with embedded UI (Linux)
        if: runner.os == 'Linux'
        run: ./gradlew bootJar -PpreviewUiDir=ui/dist --no-daemon

      - name: Build backend with embedded UI (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat bootJar -PpreviewUiDir=ui/dist --no-daemon

      - name: Verify embedded UI in JAR (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: jar tf build/libs/devvault-0.0.1-SNAPSHOT.jar | grep -Fx 'BOOT-INF/classes/static/index.html'

      - name: Verify embedded UI in JAR (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $entries = jar tf build/libs/devvault-0.0.1-SNAPSHOT.jar
          if ($entries -notcontains 'BOOT-INF/classes/static/index.html') {
            throw 'The executable JAR does not contain the compiled UI.'
          }

      - name: Smoke test integrated app (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/smoke-test-linux.sh

      - name: Smoke test integrated app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-test-windows.ps1

      - name: Package preview (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="0.0.0-ci"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; fi
          bash packaging/linux/Empaquetar-Preview.sh "$version"

      - name: Package preview (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '0.0.0-ci'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
          ./packaging/windows/Empaquetar-Preview.ps1 -Version $version

      - name: Create SHA-256 checksum (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="0.0.0-ci"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; fi
          archive="$(find build/distribution -maxdepth 1 -name "DevVault-$version-linux-*.tar.gz" -print -quit)"
          [[ -n "$archive" ]] || { echo 'No se encontró el tar.gz de Linux.' >&2; exit 1; }
          (cd build/distribution && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")

      - name: Create SHA-256 checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '0.0.0-ci'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
          $archive = Get-ChildItem build/distribution -Filter "DevVault-$version-windows-*.zip" | Select-Object -First 1
          if (-not $archive) { throw 'No se encontró el ZIP de preview.' }
          $hash = (Get-FileHash -Algorithm SHA256 $archive.FullName).Hash.ToLowerInvariant()
          "$hash  $($archive.Name)" | Set-Content -NoNewline "$($archive.FullName).sha256"

      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: DevVault-Preview-Linux
          path: |
            build/distribution/*.tar.gz
            build/distribution/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DevVault-Preview-Windows
          path: |
            build/distribution/*.zip
            build/distribution/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: DevVault-Preview-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*.zip release-assets/*.tar.gz)
          checksums=(release-assets/*.sha256)
          [[ ${#assets[@]} -eq 2 ]] || { echo 'Se requieren paquetes Windows y Linux.' >&2; exit 1; }
          [[ ${#checksums[@]} -eq 2 ]] || { echo 'Faltan checksums SHA-256.' >&2; exit 1; }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if [[ "$version" == *-* ]]; then
            gh release create "$tag" release-assets/* --title "DevVault $version" --generate-notes --prerelease
          else
            gh release create "$tag" release-assets/* --title "DevVault $version" --generate-notes
          fi
