services:
  postgres:
    image: postgres:16-alpine
    container_name: devvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devvault
      POSTGRES_USER: devvault
      POSTGRES_PASSWORD: devvault_dev
    ports:
      - "5432:5432"
    volumes:
      - devvault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devvault -d devvault"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devvault_pgdata: